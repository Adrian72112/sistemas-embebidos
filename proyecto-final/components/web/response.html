<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comando Enviado - MQTT</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Control ESP32</h1>
            <p>Sistema de envío de comandos MQTT</p>
        </header>
        
        <main>
            <div class="form-container">
                <div class="success-message">
                    <h2>✅ Comando Recibido</h2>
                    <p>Tu comando ha sido procesado correctamente y será enviado por MQTT.</p>
                    <div class="command-display">
                        <strong>Comando:</strong> <span id="command-text">%s</span>
                    </div>
                    <a href="/" class="btn-primary" style="display: inline-block; text-decoration: none; margin-top: 20px;">
                        Enviar otro comando
                    </a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2025 ESP32 Control System</p>
        </footer>
    </div>
</body>
</html>
